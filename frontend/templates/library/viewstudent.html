<script>

function logout() {
  fetch('http://library-1443069192.ap-south-1.elb.amazonaws.com/logout/', {method:'POST', headers:{'X-CSRFToken': getCookie('csrftoken')}})
    .then(() => { localStorage.removeItem('userName'); window.location.href='/'; })
    .catch(() => { localStorage.removeItem('userName'); window.location.href='/'; });
}
function getCookie(name) {
  let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}
</script>
<script>

fetch('http://library-1443069192.ap-south-1.elb.amazonaws.com/api/students/', {credentials:'include'})
  .then(r => r.json())
  .then(students => {
    const container = document.getElementById('studentContainer');
    if (!students || students.length === 0) {
      container.innerHTML = '<h1>No Student Registered in Library</h1>';
      return;
    }
    let html = '<table class="redTable"><thead><tr><th>Name</th><th>Enrollment</th><th>Branch</th></tr></thead><tfoot><tr><td colspan="3"><div class="links"></div></td></tr></tfoot><tbody>';
    students.forEach(s => {
      html += `<tr><td>${s.name}</td><td>${s.enrollment}</td><td>${s.branch}</td></tr>`;
    });
    html += '</tbody></table>';
    container.innerHTML = html;
  })
  .catch(() => {
    document.getElementById('studentContainer').innerHTML = '<p class="alert alert-danger">Failed to load students. Please ensure you are logged in.</p>';
  });
</script>
