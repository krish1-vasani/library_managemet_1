<footer style="padding:0;background-color:black;margin:0;">
  <p style="text-align:center;">
    <a href="https://facebook.com/sumit.luv/" class="fa fa-facebook" style="background:#3B5998;color:white;padding:20px;font-size:23px;width:60px;text-align:center;text-decoration:none;margin:5px 2px;border-radius:50%;margin-top:30px;"></a>

  </div></div></div>

<script>
function logout() {
  fetch('/logout/', {method:'POST', headers:{'X-CSRFToken': getCookie('csrftoken')}})
    .then(() => { localStorage.removeItem('userName'); window.location.href='/'; })
    .catch(() => { localStorage.removeItem('userName'); window.location.href='/'; });
}
function getCookie(name) {
  let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}
</script>
<script>
fetch('/api/myissuedbooks/', {credentials:'include'})
  .then(r => r.json())
  .then(data => {
    const container = document.getElementById('myBooksContainer');
    if (!data || data.li1.length === 0) {
      container.innerHTML = '<h1>No book Issued to you</h1>';
      return;
    }
    const li1 = data.li1, li2 = data.li2;
    let html = '<div class="row">';
    // Left table
    html += `<div class="col-lg-6" style="padding-right:0px;"><table class="redTable"><thead><tr>
      <th>Name</th><th>Enrollment</th><th>Branch</th><th>Book Name</th><th>Book Author</th>
    </tr></thead><tfoot><tr><td colspan="7"><div class="links"></div></td></tr></tfoot><tbody>`;
    li1.forEach(t => {
      html += `<tr><td>${t[0]}</td><td>${t[1]}</td><td>${t[2]}</td><td>${t[3]}</td><td>${t[4]}</td></tr>`;
    });
    html += '</tbody></table></div>';
    // Right table
    html += `<div class="col-lg-6" style="padding-left:0px;"><table class="redTable"><thead><tr>
      <th>Issue Date</th><th>Expiry Date</th><th>Fine</th><th>Status</th><th>Action</th>
    </tr></thead><tfoot><tr><td colspan="5"><div class="links"></div></td></tr></tfoot><tbody>`;
    li2.forEach(t => {
      const fine = t[3] === 'Returned' ? 'No Fine' : t[2];
      const action = t[3] === 'Issued'
        ? `<button onclick="returnBook(${t[4]})" type="button" class="btn btn-warning btn-sm">Return</button>`
        : '';
      html += `<tr><td>${t[0]}</td><td>${t[1]}</td><td>${fine}</td><td>${t[3]}</td><td>${action}</td></tr>`;
    });
    html += '</tbody></table></div></div>';
    container.innerHTML = html;
  })
  .catch(() => {
    document.getElementById('myBooksContainer').innerHTML = '<p class="alert alert-danger">Failed to load books. Please ensure you are logged in.</p>';
  });

function returnBook(id) {
  fetch('/returnbook/' + id + '/', {method:'GET', credentials:'include'})
    .then(() => location.reload())
    .catch(() => alert('Failed to return book. Please try again.'));
}
</script>
</body>
</html>
