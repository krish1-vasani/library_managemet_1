<center><h3 style="margin-bottom:0px;" class="alert alert-success">Login As Admin!</h3></center>
<div class="signup-form">
  <form method="post" id="adminLoginForm" class="form-horizontal">
    <center><h2>Admin Login</h2></center>
    <div class="form-group">
      <label class="control-label col-xs-4">Username</label>
      <div class="col-xs-8">
        <input type="text" name="username" id="username" class="form-control" required>

    </div>
    <div class="form-group">
      <label class="control-label col-xs-4">Password</label>

    </div>
    <div id="loginError" class="alert alert-danger" style="display:none;"></div>
    <div class="form-group">
      <div class="col-xs-8 col-xs-offset-4">

<script>


document.getElementById('adminLoginForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const data = new URLSearchParams();
  data.append('username', document.getElementById('username').value);
  data.append('password', document.getElementById('password').value);
  data.append('csrfmiddlewaretoken', getCookie('csrftoken'));
  fetch('http://library-ALB-444938371.ap-south-1.elb.amazonaws.com/adminlogin/', {
    method: 'POST',
    body: data,
    credentials: 'include',
    redirect: 'follow'
})
.then(r => {
    console.log("Status:", r.status);
    console.log("URL:", r.url);

    if (r.ok) {
        window.location.href = 'adminafterlogin.html';
    } else {
        document.getElementById('loginError').textContent =
            'Invalid credentials. Please try again.';
        document.getElementById('loginError').style.display = 'block';
    }
})
.catch(err => {
    console.log(err);
});
});
function getCookie(name) {
  let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}
</script>
