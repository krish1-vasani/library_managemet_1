<script>

function logout() {
  fetch('http://library-ALB-444938371.ap-south-1.elb.amazonaws.com/logout/', {method:'POST', headers:{'X-CSRFToken': getCookie('csrftoken')}})
    .then(() => { localStorage.removeItem('userName'); window.location.href='/'; })
    .catch(() => { localStorage.removeItem('userName'); window.location.href='/'; });
}
function getCookie(name) {
  let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}
</script>
<script>

// Load books and students from API
fetch('http://library-ALB-444938371.ap-south-1.elb.amazonaws.com/books.html', {credentials:'include'})
  .then(r => r.json())
  .then(books => {
    const sel = document.getElementById('isbn2');
    books.forEach(b => {
      const opt = document.createElement('option');
      opt.value = b.isbn;
      opt.textContent = b.name + ' [' + b.isbn + ']';
      sel.appendChild(opt);
    });
  }).catch(() => {});

fetch('http://library-ALB-444938371.ap-south-1.elb.amazonaws.com/students.html', {credentials:'include'})
  .then(r => r.json())
  .then(students => {
    const sel = document.getElementById('enrollment2');
    students.forEach(s => {
      const opt = document.createElement('option');
      opt.value = s.enrollment;
      opt.textContent = s.name + ' [' + s.enrollment + ']';
      sel.appendChild(opt);
    });
  }).catch(() => {});

document.getElementById('issueBookForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const data = new URLSearchParams(new FormData(e.target));
  data.append('csrfmiddlewaretoken', getCookie('csrftoken'));
  fetch('http://library-ALB-444938371.ap-south-1.elb.amazonaws.com/api/issuebook.html', {method:'POST', body:data, credentials:'include'})
  .then(r => {
    if(r.ok || r.redirected) window.location.href = 'bookissued.html';
    else {
      document.getElementById('issueError').textContent = 'Failed to issue book. Please try again.';
      document.getElementById('issueError').style.display = 'block';
    }
  })
  .catch(() => {
    document.getElementById('issueError').textContent = 'Network error. Please try again.';
    document.getElementById('issueError').style.display = 'block';
  });
});
</script>
