<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
  <style type="text/css">
    .bs-example { margin: 0px; }
    .navbar-brand { font-size: 20px; font-family: sans-serif; }
  </style>
  <title>Contact Us - Library Management System</title>
  <style media="screen">
    .contact-wrap { max-width:600px; margin:0 auto; padding:20px; }
    .form-group label { font-weight:bold; }
  </style>
</head>
<body>
<!-- Navbar (Public) -->
<div class="bs-example">
  <nav class="navbar navbar-expand-md bg-dark navbar-dark fixed-top">
    <a href="/" class="navbar-brand">Library Management</a>
    <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbarCollapse">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse justify-content-between" id="navbarCollapse">
      <div class="navbar-nav">
        <a href="/" class="nav-item nav-link active">Home</a>
        <a href="adminclick.html" class="nav-item nav-link">Admin</a>
        <a href="studentclick.html" class="nav-item nav-link">Student</a>
      </div>
      <div class="navbar-nav">
        <a href="aboutus.html" class="nav-item nav-link">About Us</a>
        <a href="contactus.html" class="nav-item nav-link">Contact Us</a>
      </div>
    </div>
  </nav>
</div>
<br><br>
<center>
  <h3 class="alert alert-success">Send Us Your Valuable Feedback !</h3>
  <div class="contact-wrap">
    <form id="contactForm">
      <div class="form-group">
        <label for="contactName">Name</label>
        <input type="text" id="contactName" name="Name" class="form-control" maxlength="30" required>
      </div>
      <div class="form-group">
        <label for="contactEmail">Email</label>
        <input type="email" id="contactEmail" name="Email" class="form-control" required>
      </div>
      <div class="form-group">
        <label for="contactMessage">Message</label>
        <textarea id="contactMessage" name="Message" class="form-control" rows="3" maxlength="500" required></textarea>
      </div>
      <div id="contactError" class="alert alert-danger" style="display:none;"></div>
      <button type="submit" class="btn btn-primary btn-lg">Send Message</button>
    </form>
  </div>
</center>
<!-- Footer -->
<footer style="padding:0;background-color:black;margin:0;">
  <p style="text-align:center;">
    <a href="https://facebook.com/sumit.luv/" class="fa fa-facebook" style="background:#3B5998;color:white;padding:20px;font-size:23px;width:60px;text-align:center;text-decoration:none;margin:5px 2px;border-radius:50%;margin-top:30px;"></a>
    <a href="https://api.whatsapp.com/send?phone=919572181024" class="fa fa-whatsapp" style="background:#25d366;color:white;padding:20px;font-size:23px;width:60px;text-align:center;text-decoration:none;margin:5px 2px;border-radius:50%;"></a>
    <a href="https://instagram.com/sumit.luv" class="fa fa-instagram" style="background:#125688;color:white;padding:20px;font-size:23px;width:60px;text-align:center;text-decoration:none;margin:5px 2px;border-radius:50%;"></a>
    <a href="https://twitter.com/sumitkumar1503" class="fa fa-twitter" style="background:#55ACEE;color:white;padding:20px;font-size:23px;width:60px;text-align:center;text-decoration:none;margin:5px 2px;border-radius:50%;"></a>
  </p><br>
  <div class="container"><div class="row"><div class="col-md-12 col-sm-12">
    <div style="color:#ffffff;text-align:center;"><p>Made in India <br>Copyright &copy; 2020 LazyCoder</p></div>
  </div></div></div>
</footer>
<script>
const API_BASE = 'http://django-alb-1692330624.ap-south-1.elb.amazonaws.com';

document.getElementById('contactForm').addEventListener('submit', function(e) {
  e.preventDefault();
  const body = {
    name: document.getElementById('contactName').value,
    email: document.getElementById('contactEmail').value,
    message: document.getElementById('contactMessage').value
  };
  fetch(`${API_BASE}/contactus.html`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json', 'X-CSRFToken': getCookie('csrftoken')},
    body: JSON.stringify(body)
  })
  .then(r => {
    if(r.ok || r.redirected) window.location.href = 'contactussuccess.html';
    else document.getElementById('contactError').textContent = 'Failed to send. Please try again.', document.getElementById('contactError').style.display='block';
  })
  .catch(() => window.location.href = 'contactussuccess.html');
});
function getCookie(name) {
  let v = document.cookie.match('(^|;) ?' + name + '=([^;]*)(;|$)');
  return v ? v[2] : null;
}
</script>
</body>
</html>
